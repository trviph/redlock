name: Go Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: 'go.mod'

    - name: Start Redis
      run: docker compose up -d

    - name: Run Tests
      run: go test -v ./...

    - name: Stop Redis
      if: always()
      run: docker compose down
